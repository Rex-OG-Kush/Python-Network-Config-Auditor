# Multi-Vendor Infrastructure Compliance Auditing Matrix
cisco_ios:
  forbidden_commands:
    - "transport input telnet"      # Blocks unencrypted terminal access
    - "ip http server"              # Blocks unencrypted web administration
    - "secret 0 default_password123"# Flags insecure plaintext/default credential loops
  mandatory_commands:
    - "transport input ssh"         # Enforces encrypted management access
    - "no ip domain-lookup"         # Disables vulnerable router DNS lookups

mikrotik_routeros:
  forbidden_commands:
    - "/ip service set telnet disabled=no"  # Alerts if telnet is active
    - "/user add name=admin"                # Flags insecure default username setup
  mandatory_commands:
    - "/ip service set winbox disabled=yes" # Enforces secure API paths
